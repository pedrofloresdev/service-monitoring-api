[pytest]
testpaths = tests
# PostgreSQL tests (tests/postgres) are deselected by default; run them with
# `TEST_POSTGRES_URL=... pytest -m postgres --no-cov`.
addopts = -v --tb=short --cov=app --cov-report=term-missing -m "not postgres"
markers =
    postgres: needs a PostgreSQL server at TEST_POSTGRES_URL (spec 001)
